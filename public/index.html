<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말하기 연습 · Language Conversation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div id="login-view" class="view active">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">💬</div>
      <h1 class="app-title">말하기 연습</h1>
      <p class="app-subtitle">원어민과 함께하는 외국어 회화</p>
    </div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">사용자 이름</label>
        <input type="text" id="username" placeholder="이름을 입력하세요" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
      </div>
      <div id="login-error" class="error-msg hidden">이름과 비밀번호를 입력해주세요.</div>
      <button type="submit" class="btn-primary btn-full">로그인</button>
    </form>
  </div>
</div>

<!-- ── 언어 선택 화면 ── -->
<div id="language-view" class="view">
  <header class="lang-header">
    <div class="user-greeting">
      안녕하세요, <span id="display-name">사용자</span>님! 👋
    </div>
    <button id="logout-btn" class="btn-ghost">로그아웃</button>
  </header>

  <main class="lang-content">
    <h2 class="lang-title">어떤 언어를 연습할까요?</h2>
    <p class="lang-subtitle">학습하고 싶은 언어를 선택하세요</p>

    <div class="lang-grid">
      <button class="lang-card" data-lang="korean" aria-label="한국어">
        <span class="lang-flag">🇰🇷</span>
        <span class="lang-name">한국어</span>
        <span class="lang-native">Korean</span>
      </button>
      <button class="lang-card" data-lang="chinese" aria-label="중국어">
        <span class="lang-flag">🇨🇳</span>
        <span class="lang-name">中文</span>
        <span class="lang-native">Chinese</span>
      </button>
      <button class="lang-card" data-lang="english" aria-label="영어">
        <span class="lang-flag">🇺🇸</span>
        <span class="lang-name">English</span>
        <span class="lang-native">영어</span>
      </button>
      <button class="lang-card" data-lang="japanese" aria-label="일본어">
        <span class="lang-flag">🇯🇵</span>
        <span class="lang-name">日本語</span>
        <span class="lang-native">Japanese</span>
      </button>
    </div>

    <!-- 수준 선택 -->
    <div class="level-section">
      <p class="level-label">학습 수준을 선택하세요</p>
      <div class="level-grid">
        <button class="level-card" data-level="advanced">
          <span class="level-icon">🏆</span>
          <span class="level-name">상급</span>
          <span class="level-desc">토익 800+</span>
        </button>
        <button class="level-card" data-level="intermediate">
          <span class="level-icon">⭐</span>
          <span class="level-name">중급</span>
          <span class="level-desc">토익 600+</span>
        </button>
        <button class="level-card" data-level="beginner">
          <span class="level-icon">🌱</span>
          <span class="level-name">하급</span>
          <span class="level-desc">토익 600 이하</span>
        </button>
      </div>
    </div>

    <button id="start-btn" class="btn-primary btn-start" disabled>
      대화 시작하기 <span class="arrow">→</span>
    </button>
  </main>
</div>

<!-- ── 채팅 화면 ── -->
<div id="chat-view" class="view">
  <header class="chat-header">
    <button id="back-btn" class="btn-ghost btn-icon" aria-label="뒤로">←</button>
    <div class="chat-header-info">
      <span id="chat-flag" class="chat-flag">🇺🇸</span>
      <div>
        <div id="chat-lang-label" class="chat-lang-label">English</div>
        <div class="chat-status-label">원어민 파트너 연결됨</div>
      </div>
    </div>
    <div id="wakelock-badge" class="wakelock-badge hidden" title="대화 중 화면 꺼짐 방지">🔒 화면유지</div>
    <button id="tts-btn" class="btn-tts" title="AI 음성 출력">🔊</button>
  </header>

  <div id="messages" class="messages" role="log" aria-live="polite"></div>

  <div class="chat-input-wrap">
    <button id="mic-btn" class="btn-mic" aria-label="음성 입력" title="음성으로 말하기">
      <!-- 마이크 아이콘 (기본) -->
      <svg id="mic-on-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
      </svg>
      <!-- 마이크 꺼짐 아이콘 (녹음중) -->
      <svg id="mic-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V20c0 .55.45 1 1 1s1-.45 1-1v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>
      </svg>
    </button>
    <textarea
      id="msg-input"
      class="msg-textarea"
      placeholder="메시지를 입력하거나 🎤 마이크를 누르세요"
      rows="1"
      aria-label="메시지 입력"
    ></textarea>
    <button id="send-btn" class="btn-send" aria-label="전송">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
