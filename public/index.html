<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말하기 연습 · Language Conversation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div id="login-view" class="view active">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">💬</div>
      <h1 class="app-title">말하기 연습</h1>
      <p class="app-subtitle">원어민과 함께하는 외국어 회화</p>
    </div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">사용자 이름</label>
        <input type="text" id="username" placeholder="이름을 입력하세요" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
      </div>
      <div id="login-error" class="error-msg hidden">이름과 비밀번호를 입력해주세요.</div>
      <button type="submit" class="btn-primary btn-full">로그인</button>
    </form>
  </div>
</div>

<!-- ── 언어 선택 화면 ── -->
<div id="language-view" class="view">
  <header class="lang-header">
    <div class="user-greeting">
      안녕하세요, <span id="display-name">사용자</span>님! 👋
    </div>
    <button id="logout-btn" class="btn-ghost">로그아웃</button>
  </header>

  <main class="lang-content">
    <h2 class="lang-title">어떤 언어를 연습할까요?</h2>
    <p class="lang-subtitle">학습하고 싶은 언어를 선택하세요</p>

    <div class="lang-grid">
      <button class="lang-card" data-lang="korean" aria-label="한국어">
        <span class="lang-flag">🇰🇷</span>
        <span class="lang-name">한국어</span>
        <span class="lang-native">Korean</span>
      </button>
      <button class="lang-card" data-lang="chinese" aria-label="중국어">
        <span class="lang-flag">🇨🇳</span>
        <span class="lang-name">中文</span>
        <span class="lang-native">Chinese</span>
      </button>
      <button class="lang-card" data-lang="english" aria-label="영어">
        <span class="lang-flag">🇺🇸</span>
        <span class="lang-name">English</span>
        <span class="lang-native">영어</span>
      </button>
      <button class="lang-card" data-lang="japanese" aria-label="일본어">
        <span class="lang-flag">🇯🇵</span>
        <span class="lang-name">日本語</span>
        <span class="lang-native">Japanese</span>
      </button>
    </div>

    <button id="start-btn" class="btn-primary btn-start" disabled>
      대화 시작하기 <span class="arrow">→</span>
    </button>
  </main>
</div>

<!-- ── 채팅 화면 ── -->
<div id="chat-view" class="view">
  <header class="chat-header">
    <button id="back-btn" class="btn-ghost btn-icon" aria-label="뒤로">←</button>
    <div class="chat-header-info">
      <span id="chat-flag" class="chat-flag">🇺🇸</span>
      <div>
        <div id="chat-lang-label" class="chat-lang-label">English</div>
        <div class="chat-status-label">원어민 파트너 연결됨</div>
      </div>
    </div>
    <div></div>
  </header>

  <div id="messages" class="messages" role="log" aria-live="polite"></div>

  <div class="chat-input-wrap">
    <textarea
      id="msg-input"
      class="msg-textarea"
      placeholder="메시지를 입력하세요… (Enter 전송, Shift+Enter 줄바꿈)"
      rows="1"
      aria-label="메시지 입력"
    ></textarea>
    <button id="send-btn" class="btn-send" aria-label="전송">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
